# UrMach x86-64 dev-loop boot config (#406).
#
# One entry, no menu: timeout 0 auto-boots immediately so the QEMU serial
# loop is as fast as the old `-kernel` path.  GRUB is routed to the serial
# line too, so `qemu -nographic -serial mon:stdio` shows both GRUB's own
# diagnostics and the kernel's banners on one wire.
#
# multiboot2 (not multiboot) is what loads an ELF64 kernel; the handoff is
# still 32-bit protected mode, paging off — long mode is the kernel's job.

serial --unit=0 --speed=38400
terminal_input serial console
terminal_output serial console
# Two entries and no menu: `default` picks one and `timeout=0` takes it
# immediately, so the ordinary loop is as fast as it was.  The second exists
# because the debugger (#428) is deliberately behind a flag — an unattended
# boot must end in a halt and not at a prompt nobody is there to answer — and
# a flag that cannot be given is a flag that is never used.
set timeout=0

# Which entry boots, written into the image at build time from
# UROS_X86_64_BOOT_ENTRY (see the uros_iso target).  Sourced rather than
# written here so that selecting a different one does not mean editing a
# tracked file -- and so that an unattended run can reach entries 1 and 2 at
# all, which with `timeout=0' it otherwise cannot (#458).
set default=0
source /boot/grub/entry.cfg

menuentry "UrMach x86-64" {
	multiboot2 /boot/mach_kernel
	module2 /boot/boot_probe boot_probe
	boot
}

menuentry "UrMach x86-64 (ddb on fault)" {
	multiboot2 /boot/mach_kernel -r
	module2 /boot/boot_probe boot_probe
	boot
}

# The terminal self-test, which cannot share a boot with the kernel (#458).
#
# double_fault_selftest() breaks the stack on purpose so the fault lands on
# its own IST and can be reported at all; there is nothing to return to
# afterwards, and the run ends in `no handler -- halted'.  setup_main() does
# not return either.  Two endings, so two boots -- and this is the one that
# keeps the double fault covered now that the ordinary boot goes on into the
# machine-independent kernel instead.
menuentry "UrMach x86-64 (terminal double-fault self-test)" {
	multiboot2 /boot/mach_kernel -D
	module2 /boot/boot_probe boot_probe
	boot
}

# The scheduler clock, measured against the TSC before the kernel is entered
# (#459).
#
# Its own entry because it cannot share the ordinary boot: the kernel stops at
# bootstrap_create (#422) within a few milliseconds of starting its first
# thread, which is less than one tick -- so a rate cannot be read from a run
# that ends before the second sample.  This one spends two seconds counting
# ticks first, then goes on into setup_main exactly as entry 0 does.
menuentry "UrMach x86-64 (clock burn-in)" {
	multiboot2 /boot/mach_kernel -C
	module2 /boot/boot_probe boot_probe
	boot
}

# Same burn-in, with -T forcing the LAPIC backend even where the deadline
# timer is available -- so the two can be compared on the SAME binary.  An A/B
# across two builds measures the builds as much as the change.
menuentry "UrMach x86-64 (clock burn-in, lapic forced)" {
	multiboot2 /boot/mach_kernel -CT
	module2 /boot/boot_probe boot_probe
	boot
}

# Does the clock actually preempt? (#459)
#
# Three kernel threads bound to one processor, none of which ever yields: two
# counters and a reporter that can only print by being scheduled against them.
# Bound to ONE processor because on four they would run side by side and both
# counters would advance on a kernel with no clock at all.
#
# Its own entry, and in place of the first thread rather than beside it: the
# first thread reaches bootstrap_create and panics there (#422) within a few
# milliseconds, and a test that needs a second of wall clock cannot win that
# race.
#
# ⚠️ The failure here is SILENCE.  Without preemption the first thread
# scheduled runs forever and nothing is printed -- the harness times out.  A
# test that could only report success would be no test.
menuentry "UrMach x86-64 (preemption test)" {
	multiboot2 /boot/mach_kernel -P
	module2 /boot/boot_probe boot_probe
	boot
}

# Does vector state survive an involuntary switch? (#408)
#
# Several kernel threads sharing ONE application processor, each holding a
# different pattern in all sixteen vector registers and never reloading it.
# The only way any of them keeps running is by being taken away and given
# back, so what they read at the end is what the switch kept.
#
# Different patterns per thread, deliberately: with one shared value a switch
# that restored the wrong thread's save area would produce exactly the right
# answer.
#
# ⚠️ boot_c.c's fpu_probe() is not this test.  It calls context_switch()
# itself, on the boot processor, before there is a scheduler -- it checks the
# machinery when a thread hands the processor over on purpose.  Preemption is
# the other kind, and until #459 and #461 this machine could not do it.
menuentry "UrMach x86-64 (vector state across preemption)" {
	multiboot2 /boot/mach_kernel -F
	module2 /boot/boot_probe boot_probe
	boot
}

# thread_get_state and thread_set_state themselves (#408).
#
# machine_kernel_ready() checks the flavour dispatch on every boot, but it
# drives act_machine_[gs]et_state() directly, because at that point there is no
# scheduler.  This is the rest of the path: the machine-independent entry
# points, which refuse the calling activation, hold the target, wait for it to
# block, and only then ask this machine.
#
# ⚠️ Needs a second thread that is genuinely stopped, so it cannot run on the
# ordinary boot: the target has to be parked in an interruptible wait before
# thread_get_state() will look at it, and building one costs a thread that
# never comes back.
menuentry "UrMach x86-64 (thread_get_state round trip)" {
	multiboot2 /boot/mach_kernel -G
	module2 /boot/boot_probe boot_probe
	boot
}

# May a return to ring 0 run an AST_APC handler? (#463)
#
# AST_APC is a return-to-USER hook -- kern/thread_act.c's nudge() says so --
# and its handler takes a mutex and can park the thread.  x86-64 was taking it
# on kernel-mode trap returns too, which is a window a few instructions wide
# and therefore hopeless to wait for: measured, merely LINKING a new object
# file without executing it moved the rate from zero in ten to one in ten.
#
# So the probe builds the state thread_hold() produces on a thread about to
# block -- an interruptible wait outstanding and an APC pending -- and lets the
# tick arrive.  On a kernel with the defect this entry PANICS; that is the
# control arm, and it is meant to.
menuentry "UrMach x86-64 (kernel-mode AST)" {
	multiboot2 /boot/mach_kernel -A
	module2 /boot/boot_probe boot_probe
	boot
}

# Can the debugger actually be entered? (#428)
#
# -r arms it, -B calls Debugger() from ordinary kernel context once the kernel
# is up.  That combination is the one done-when of #428 that had never been
# demonstrated: every boot log on this target is a self-test run, and a
# self-test run never opens the prompt.
#
# ⚠️ This entry STOPS AT A PROMPT and waits.  It is meant to be driven --
# ~/uros-tests/ddb-drive.sh feeds it commands and reads the answers -- and an
# undriven run of it will sit there until the backstop fires, which is the
# correct behaviour for a debugger and the reason it is not on entry 0.
menuentry "UrMach x86-64 (debugger entry)" {
	multiboot2 /boot/mach_kernel -rB
	module2 /boot/boot_probe boot_probe
	boot
}

# Is a thread blocked with a continuation reported without walking its stack?
# (#428)
#
# The rule is that such a thread is described by its resume point and never by
# a backtrace: the continuation is the thread saying it does not need its
# stack kept, and the stack is then reset to the trampoline.  It stays mapped
# and stays walkable, which is what makes walking it dangerous -- the answer
# comes back well-formed and says nothing.
#
# On this target none of the three callers that block with a continuation runs
# (the IPC receive path needs userland, #422), so the rule had no subject and
# had never once executed.  -L builds one and opens the prompt on it.
menuentry "UrMach x86-64 (thread with a continuation)" {
	multiboot2 /boot/mach_kernel -rL
	module2 /boot/boot_probe boot_probe
	boot
}

# A machine that stays up, so the console door can be demonstrated (#428).
#
# Every other entry stops within milliseconds of its first tick -- the kernel
# reaches bootstrap_create and panics there for want of a userland bundle
# (#422) -- so there has never been a RUNNING machine on this target to break
# into, only one that had already stopped.  -S parks the thread that would go
# on to bootstrap_create and lets the machine idle.
menuentry "UrMach x86-64 (stay up, debugger armed)" {
	multiboot2 /boot/mach_kernel -rS
	module2 /boot/boot_probe boot_probe
	boot
}

# The name server as the boot task (#426).
#
# In PLACE of boot_probe and not beside it: the kernel starts module 0 and
# nothing else here, so the two cannot share a boot.  What this entry asks is
# the question boot_probe cannot: a real server, entered the way servers are,
# demultiplexing MIG in one direction while calling it in the other, and
# printing through the DEVICE port rather than through a Mach trap written for
# the purpose.
#
# ⚠️ It is expected to stop, and where it stops is the point.  service_checkin
# is answered by the bootstrap server, which does not run on this target yet
# (#422's bundle), so the name server reaches its check-in and can go no
# further.  Everything before that line is what #426 is about; the line itself
# is what is left, and it names its own reason.
menuentry "UrMach x86-64 (name server as the boot task)" {
	multiboot2 /boot/mach_kernel
	module2 /boot/name_server name_server
	boot
}

# The system booting the way the system boots (#422).
#
# Module 0 is bootstrap -- init on this machine as on i386, the first task the
# kernel starts and the one that creates every server after it -- and module 1
# is the stage-1 bundle it reads bootstrap.conf out of.  The kernel maps the
# bundle into the new task and injects `--bundle=ADDR,SIZE' on its argv; that
# is machine-independent code in kern/bootstrap.c and has been waiting for a
# 64-bit task to hand it to.
#
# ⚠️ In PLACE of boot_probe, not beside it: the kernel starts module 0 and
# nothing else, so every entry above chooses ONE first task.  What this one
# asks that the others cannot is whether a task can create another task --
# everything up to here has been one image doing things by itself.
menuentry "UrMach x86-64 (bootstrap as init)" {
	multiboot2 /boot/mach_kernel
	module2 /boot/bootstrap bootstrap
	module2 /boot/bootstrap.bundle bootstrap.bundle
	boot
}
