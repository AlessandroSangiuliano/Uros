#
# The campaign on the epic (#653).  The short A/B and the merge test run on a
# batch of branches save machine time and find fewer rare races by chance, so
# the boots saved are spent here: the merge test's entries, round after round,
# on GitHub's free runners.  scripts/ci/job.sh is one job of it, and
# scripts/ci/pull-results.sh brings the rows and the failed logs into
# ~/uros-tests.  The runner's clock is not ours to set, so rows are compared
# within one job only.
#
# Run by hand with `ablate`, every job takes fixes out instead: scripts/ablate.sh
# --ab with the patches of ablations/ named, for a defect only some runners
# show -- #603's showed only on the AMD EPYC 9V45 under KVM (#656).  Or with
# `sweep`, the jobs share out the patches and run each once, the ablated arm
# alone: whether every patch still applies, builds and is caught (#643).
#
# A sweep of every patch runs once a week, and by hand before a release (#975).
# On Sundays master's nightly.yml dispatches this file with `sweep: all' at
# NIGHTLY_REF, and waits for the run, whose verdict becomes its own: a run
# another workflow starts by dispatch is github-actions[bot]'s, and its failure
# is told to nobody, where a scheduled run's is told to whoever last wrote its
# cron.  Before a release, by hand:
#   gh workflow run campaign.yml --ref BRANCH -f sweep=all -f jobs=8
# A patch the sweep says is no longer caught is a hole in what the tests guard:
# its test no longer looks, its Expect: no longer matches what the test says
# (973-modload-test-not-started's, once #977 had changed entry 68's line), or
# it no longer takes its fix out.
#
# ── Where this file lives, and which copy each run takes (#961) ─────────
#
# It is on master and on the epic.  A push runs the copy of the branch pushed,
# and a dispatch the copy at the ref it is started at -- but GitHub dispatches
# only a workflow whose file the default branch, master, has as well.  That is
# why master keeps a copy, with workflow_dispatch and no schedule.
#
# 🔑 The nightly is not this file's.  master's nightly.yml has the schedule,
# and dispatches this file at the branch the repository variable NIGHTLY_REF
# names -- the epic while one lives -- with `nightly' set.  So the nightly
# runs the epic's copy of these steps on the epic's tree, and a difference
# between the two copies cannot reach it.  It did: from 06/10 to 18/11 the
# schedule ran master's copy, which lacked the udev settle below, and its jobs
# booted without KVM, all of them from 11/11.
#
# The two copies differ in push.branches alone.  master's names the epic, so
# that a push to master runs nothing while the epic lives; the epic's names
# master too, which takes effect on the day it is master's.
# ⚠️ A public repository's runs are public, their logs and artifacts included.
name: campaign

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to boot (empty: the branch this is run from)"
        type: string
        required: false
      entries:
        description: "Only these merge-test entries, e.g. 14 16 (empty: all of them)"
        type: string
        required: false
      rounds:
        description: "Merge-test rounds per job (empty: 2)"
        type: string
        required: false
      jobs:
        description: "Jobs side by side, 1 to 20 (empty: 6)"
        type: string
        required: false
      mode:
        description: "arch: the Arch Linux container; ubuntu: the runner's own packages; both: each job in both, to compare them (empty: arch)"
        type: string
        required: false
      ablate:
        description: "An A/B instead of the merge test: patches of ablations/ by name, e.g. 603-ast-interrupt-late 603-act-ast (empty: the merge test)"
        type: string
        required: false
      boots:
        description: "With ablate: boots per arm and accelerator in each job (empty: 3)"
        type: string
        required: false
      sweep:
        description: "Each patch once instead of the merge test, shared out among the jobs: all (every ablation with an Expect: line) or patch names (empty: no sweep)"
        type: string
        required: false
      minutes:
        description: "Minutes the boots' step may run, 10 to 330; the merge test's rounds stop 5 before (empty: 330)"
        type: string
        required: false
      nightly:
        description: "Set by master's nightly.yml, which dispatches the nightly (#961): by hand, leave it off"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - epic/v0.3.0-x86-64
      # #961: the epic alone, in master's copy, so that a push to master runs
      # nothing while the epic lives.  The epic's copy names master too.

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      rounds: ${{ steps.plan.outputs.rounds }}
      entries: ${{ steps.plan.outputs.entries }}
      modes: ${{ steps.plan.outputs.modes }}
      ablate: ${{ steps.plan.outputs.ablate }}
      boots: ${{ steps.plan.outputs.boots }}
      sweep: ${{ steps.plan.outputs.sweep }}
      jobs: ${{ steps.plan.outputs.jobs }}
      minutes: ${{ steps.plan.outputs.minutes }}
      job_minutes: ${{ steps.plan.outputs.job_minutes }}
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The tree is resolved once, here, so that every job boots the same one
      # even if the branch moves while they start.  The defaults live here and
      # nowhere else, and job.sh --dry-run refuses a bad entry or round, and
      # prints the plan, before twenty runners are spent on it.
      - name: Plan
        id: plan
        env:
          JOBS: ${{ inputs.jobs }}
          ROUNDS: ${{ inputs.rounds }}
          ENTRIES: ${{ inputs.entries }}
          MODE: ${{ inputs.mode }}
          ABLATE: ${{ inputs.ablate }}
          BOOTS: ${{ inputs.boots }}
          SWEEP: ${{ inputs.sweep }}
          MINUTES: ${{ inputs.minutes }}
          NIGHTLY: ${{ inputs.nightly }}
          EVENT: ${{ github.event_name }}
        run: |
          # #961: what started the run, for job.txt and pull-results.sh: the
          # nightly is a dispatch as one started by hand is, and only the input
          # nightly.yml sets tells the two apart.
          kind=$EVENT
          [ "$NIGHTLY" = true ] && kind=nightly
          # Which toolchain builds and boots: ours, from Arch, in a container,
          # or Ubuntu's own, GCC and qemu several versions older -- both side
          # by side is how the first run decides whether the container is
          # needed at all (#653).
          case "${MODE:-arch}" in
          arch) modes='["arch"]' ;;
          ubuntu) modes='["ubuntu"]' ;;
          both) modes='["arch","ubuntu"]' ;;
          *) echo "::error::mode is arch, ubuntu or both, not '$MODE'"; exit 1 ;;
          esac
          # #941: six jobs of two rounds boot as many as four of three, on
          # more runners.  A round of the merge test took 104 to 108 minutes
          # on 20/11, and three no longer fitted in the step's 330: the push
          # campaign of 9a6e2ab8 stopped on three jobs of four, all three on
          # an AMD EPYC 7763.  Two rounds leave about one round's time spare.
          jobs=${JOBS:-6}
          rounds=${ROUNDS:-2}
          case "$jobs" in
          ''|*[!0-9]*) echo "::error::jobs is a number from 1 to 20, not '$jobs'"; exit 1 ;;
          esac
          if [ "$jobs" -lt 1 ] || [ "$jobs" -gt 20 ]; then
            echo "::error::jobs is a number from 1 to 20, not '$jobs'"
            exit 1
          fi
          # Checked here as well as by job.sh because it goes to GITHUB_OUTPUT,
          # where a newline would start an output of its own.
          case "$ENTRIES" in
          *[!0-9\ ,]*) echo "::error::entries are entry numbers, not '$ENTRIES'"; exit 1 ;;
          esac
          case "$ABLATE" in
          *[!A-Za-z0-9._\ ,-]*) echo "::error::ablate names patches of ablations/, not '$ABLATE'"; exit 1 ;;
          esac
          case "$SWEEP" in
          *[!A-Za-z0-9._\ ,-]*) echo "::error::sweep is all or names patches of ablations/, not '$SWEEP'"; exit 1 ;;
          esac
          boots=${BOOTS:-3}
          case "$boots" in
          ''|*[!0-9]*) echo "::error::boots is a number of boots, not '$boots'"; exit 1 ;;
          esac
          # #951: the boots' step's limit and the job's, from one number.  The
          # merge test's rounds stop five minutes before the step's limit
          # (job.sh --stop-at), and the job's leaves fifteen more after it,
          # for the summary and the upload.
          minutes=${MINUTES:-330}
          case "$minutes" in
          ''|*[!0-9]*) echo "::error::minutes is a number from 10 to 330, not '$minutes'"; exit 1 ;;
          esac
          if [ "$minutes" -lt 10 ] || [ "$minutes" -gt 330 ]; then
            echo "::error::minutes is a number from 10 to 330, not '$minutes'"
            exit 1
          fi
          # A sweep replaces the merge test and an A/B alike, and boots each
          # patch once.  Every patch is planned here, and the last job's share
          # asked for, so that a patch ablate.sh refuses, or more jobs than
          # patches, stops the run before the runners start.
          if [ -n "$SWEEP" ]; then
            if [ -n "$ABLATE$ENTRIES$ROUNDS$BOOTS" ]; then
              echo "::error::sweep boots each patch once, in place of the merge test and an A/B: leave entries, rounds, ablate and boots empty"
              exit 1
            fi
            scripts/ci/job.sh --dry-run --no-install --sweep "$SWEEP"
            scripts/ci/job.sh --dry-run --no-install --sweep "$SWEEP" --share "$jobs/$jobs" > /dev/null
          # An A/B replaces the merge test: what it boots is its patches'
          # Run: line, so the merge test's two inputs would mean nothing.
          elif [ -n "$ABLATE" ]; then
            if [ -n "$ENTRIES$ROUNDS" ]; then
              echo "::error::entries and rounds choose the merge test's boots, and ablate replaces the merge test: leave them empty"
              exit 1
            fi
            scripts/ci/job.sh --dry-run --no-install --ablate "$ABLATE" --boots "$boots"
          else
            if [ -n "$BOOTS" ]; then
              echo "::error::boots counts the boots of an A/B, and goes with ablate"
              exit 1
            fi
            scripts/ci/job.sh --dry-run --no-install --rounds "$rounds" ${ENTRIES:+--entries "$ENTRIES"}
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "matrix=[$(seq -s, 1 "$jobs")]"
            echo "rounds=$rounds"
            echo "entries=$ENTRIES"
            echo "modes=$modes"
            echo "ablate=$ABLATE"
            echo "boots=$boots"
            echo "sweep=$SWEEP"
            echo "jobs=$jobs"
            echo "minutes=$minutes"
            echo "job_minutes=$((minutes + 15))"
            echo "kind=$kind"
          } >> "$GITHUB_OUTPUT"
          echo "the run is a $kind run, at $(git rev-parse --short=8 HEAD)" >> "$GITHUB_STEP_SUMMARY"

  boot:
    needs: plan
    runs-on: ubuntu-latest
    # Under the six hours GitHub gives a job, with room left after the boots'
    # step for the summary and the upload: the plan's minutes and fifteen.
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.job_minutes) }}
    strategy:
      # A WRONG boot fails its job, and must not cancel the others.
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.matrix) }}
        mode: ${{ fromJSON(needs.plan.outputs.modes) }}
    outputs:
      kvm: ${{ steps.kvm.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # The rule GitHub documents for the runner's /dev/kvm.  Whether a
      # standard runner has one is among the things this campaign finds out,
      # so the answer is the job's output, a notice and a line of the summary.
      - name: Make /dev/kvm usable
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          # The trigger returns before udev has applied the mode: the first run
          # tested /dev/kvm a moment too early, found it unwritable, and listed
          # it crw-rw-rw- on the next line.  settle waits for the queue.
          sudo udevadm settle || true
          if [ -c /dev/kvm ] && [ -w /dev/kvm ]; then
            available=yes
          else
            available=no
          fi
          ls -l /dev/kvm 2>&1 || true
          echo "available=$available" >> "$GITHUB_OUTPUT"
          # #961: a job without it is a fault, said as one.  Every job of the
          # epic's runs has had it since 16/10; the nightly's from 11/11 to
          # 18/11 had none, and said so by a word in a notice.  Its boots still
          # run, under TCG alone, and pull-results.sh says the same of it.
          if [ "$available" = yes ]; then
            echo "::notice::job ${{ matrix.job }}: KVM available: yes"
            echo "job ${{ matrix.job }}: KVM available: yes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::job ${{ matrix.job }}: KVM NOT available -- /dev/kvm cannot be written, and every boot of this job runs under TCG alone (#961)"
            echo "**job ${{ matrix.job }}: KVM NOT available**, so every boot of this job runs under TCG alone (#961)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The workspace is mounted, so what job.sh writes in ci-out is where the
      # upload looks for it.  The device is passed only where it can be
      # written, so the job's own test of /dev/kvm decides whether its boots
      # run under KVM as well.  --init makes job.sh a child of an init, which
      # passes on a signal docker sends the container; as PID 1 a shell would
      # ignore it.  But nothing came from GitHub: at the step's limit, and
      # when a run is cancelled, the runner sends SIGINT, then SIGTERM, to
      # this step's shell alone, then kills that shell alone, and docker was
      # left running.  In the push campaign of 35f10d00 the container went on
      # booting while the artifact was uploaded, and docker was killed at the
      # job's end as an orphan (#951).  So the job stops by itself five
      # minutes before this step's limit -- job.sh --stop-at, from the time
      # read as this script starts, before the image is pulled -- and docker
      # runs as a job waited for, under a name, so that each of the runner's
      # signals is passed on to the container as a SIGTERM, which job.sh
      # stops at as it does at its time.  The last wait gives docker's own
      # status, whatever signal ended the first.
      - name: Build and boot in an Arch Linux container
        if: matrix.mode == 'arch'
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.minutes) }}
        env:
          JOB_INDEX: ${{ matrix.job }}-${{ matrix.mode }}
          ROUNDS: ${{ needs.plan.outputs.rounds }}
          ENTRIES: ${{ needs.plan.outputs.entries }}
          ABLATE: ${{ needs.plan.outputs.ablate }}
          BOOTS: ${{ needs.plan.outputs.boots }}
          SWEEP: ${{ needs.plan.outputs.sweep }}
          SHARE: ${{ matrix.job }}/${{ needs.plan.outputs.jobs }}
          KVM: ${{ steps.kvm.outputs.available }}
          MINUTES: ${{ needs.plan.outputs.minutes }}
          CAMPAIGN_KIND: ${{ needs.plan.outputs.kind }}
        run: |
          stop_at=$(( $(date +%s) + (MINUTES - 5) * 60 ))
          kvm=()
          if [ "$KVM" = yes ]; then
            kvm=(--device /dev/kvm)
          fi
          if [ -n "$SWEEP" ]; then
            what=(--sweep "$SWEEP" --share "$SHARE")
          elif [ -n "$ABLATE" ]; then
            what=(--ablate "$ABLATE" --boots "$BOOTS")
          else
            what=(--rounds "$ROUNDS" ${ENTRIES:+--entries "$ENTRIES"})
          fi
          name=campaign-job
          trap 'docker kill --signal=TERM "$name" > /dev/null 2>&1' INT TERM
          docker run --rm --init --name "$name" "${kvm[@]}" \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e GITHUB_RUN_ID -e JOB_INDEX -e CAMPAIGN_KIND \
            archlinux:latest \
            scripts/ci/job.sh "${what[@]}" --stop-at "$stop_at" --out ci-out &
          pid=$!
          wait "$pid" || true
          while kill -0 "$pid" 2>/dev/null; do
            wait "$pid" || true
          done
          rc=0
          wait "$pid" || rc=$?
          exit $rc

      # The same job on the runner itself, with Ubuntu's packages: the other
      # half of the comparison.  If its compiler cannot build the tree with no
      # warning, or its kernel or its boots differ from the container's, the
      # container is what the campaign keeps.
      - name: Build and boot on the runner's own Ubuntu
        if: matrix.mode == 'ubuntu'
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.minutes) }}
        env:
          JOB_INDEX: ${{ matrix.job }}-${{ matrix.mode }}
          ROUNDS: ${{ needs.plan.outputs.rounds }}
          ENTRIES: ${{ needs.plan.outputs.entries }}
          ABLATE: ${{ needs.plan.outputs.ablate }}
          BOOTS: ${{ needs.plan.outputs.boots }}
          SWEEP: ${{ needs.plan.outputs.sweep }}
          SHARE: ${{ matrix.job }}/${{ needs.plan.outputs.jobs }}
          MINUTES: ${{ needs.plan.outputs.minutes }}
          CAMPAIGN_KIND: ${{ needs.plan.outputs.kind }}
        run: |
          # #951: the job stops five minutes before this step's limit, as in
          # the container's step above, and the runner's signals are passed on
          # to it, here directly, as SIGTERM.
          stop_at=$(( $(date +%s) + (MINUTES - 5) * 60 ))
          # #960: the packages are job.sh's own, by their Ubuntu names, from
          # the table the container's list comes from: this step's list of its
          # own had nothing for the 32-bit glibc and libgcc the -m32 host
          # tests are built with.
          packages=$(scripts/ci/job.sh --packages ubuntu)
          sudo apt-get update -q
          sudo apt-get install -y -q $packages
          if [ -n "$SWEEP" ]; then
            what=(--sweep "$SWEEP" --share "$SHARE")
          elif [ -n "$ABLATE" ]; then
            what=(--ablate "$ABLATE" --boots "$BOOTS")
          else
            what=(--rounds "$ROUNDS" ${ENTRIES:+--entries "$ENTRIES"})
          fi
          pid=""
          trap '[ -z "$pid" ] || kill -TERM "$pid" 2>/dev/null' INT TERM
          scripts/ci/job.sh --no-install "${what[@]}" --stop-at "$stop_at" --out ci-out &
          pid=$!
          wait "$pid" || true
          while kill -0 "$pid" 2>/dev/null; do
            wait "$pid" || true
          done
          rc=0
          wait "$pid" || rc=$?
          exit $rc

      - name: Say what the job found
        if: always()
        run: |
          if [ -f ci-out/job.txt ]; then
            { echo '```'; cat ci-out/job.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Whatever the boots said: a WRONG boot is the reason to keep them, and a
      # boot stopped, at the time limit or by a cancel, is kept as far as it
      # got, in stopped/ (#951).  The logs of the merge test's boots that were as they should be
      # stay on the runner; an A/B keeps every boot's, few and all of them evidence.  Its
      # two worktrees go when ablate.sh ends, and are left out in case a
      # stopped job left them.
      - name: Keep the rows and the failed boots' logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-job-${{ matrix.job }}-${{ matrix.mode }}
          path: |
            ci-out/
            !ci-out/logs/
            !ci-out/ablate/runs/*/fixed/
            !ci-out/ablate/runs/*/ablated/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
