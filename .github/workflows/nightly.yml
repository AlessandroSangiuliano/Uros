#
# The nightly (#961): a schedule, and one step, which dispatches campaign.yml
# at the branch the repository variable NIGHTLY_REF names -- the epic while one
# lives -- so that the nightly runs that branch's copy of the campaign on that
# branch's tree.
#
# 🔴 A scheduled run takes the workflow file of the default branch, master.
# campaign.yml's own schedule therefore ran master's copy, which nothing kept
# the same as the epic's: from 06/10 to 18/11 it lacked a step's udev settle,
# and its jobs booted without KVM, every one of them from 11/11.  So this file
# holds no step of the campaign, and a dispatch runs the copy at its ref.
#
# An empty NIGHTLY_REF, or one that names no branch of the repository,
# dispatches at master, and the run says so.  At the end of the epic: merge it
# into master, delete it, and empty the variable; the nightly then runs on
# master.  A next epic is one value of the variable.
#
# A run's GITHUB_TOKEN starts no workflow by the events it causes, except
# workflow_dispatch and repository_dispatch, which always create a run
# (GitHub's documentation on triggering a workflow from a workflow).
#
# The weekly sweep (#975): on Sundays a second cron dispatches campaign.yml at
# the same branch with `sweep: all', every patch of ablations/ booted ablated
# once, and waits for the run, whose verdict becomes this one's.  A run started
# here is github-actions[bot]'s, and its failure is told to nobody; a scheduled
# run's failure is told to whoever last wrote its cron (GitHub's documentation
# on notifications for workflow runs).  So a patch no longer caught fails this
# run, and someone hears of it.  campaign.yml's header says why it runs.
name: nightly

on:
  schedule:
    - cron: "23 1 * * *"
    - cron: "23 3 * * 0"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # The nightly's dispatch takes seconds; the sweep's step waits for the
    # sweep, eight jobs of about 80 patches each.
    timeout-minutes: 355
    env:
      SWEEP_CRON: "23 3 * * 0"
    steps:
      - name: The branch, NIGHTLY_REF's or master
        id: ref
        env:
          REPO: ${{ github.repository }}
          WANT: ${{ vars.NIGHTLY_REF }}
        run: |
          ref=$WANT
          why=""
          if [ -z "$ref" ]; then
            why="NIGHTLY_REF is empty"
          elif ! git ls-remote --exit-code --heads "https://github.com/$REPO.git" "refs/heads/$ref" > /dev/null; then
            why="NIGHTLY_REF names $ref, which is not a branch of this repository"
          fi
          if [ -n "$why" ]; then
            ref=master
            echo "::warning::$why: the campaign is dispatched at master (#961)"
            echo "**$why**: the campaign is dispatched at master (#961)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Dispatch the campaign at NIGHTLY_REF
        if: github.event.schedule != env.SWEEP_CRON
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          gh workflow run campaign.yml --repo "$REPO" --ref "$REF" -f nightly=true
          echo "the nightly: campaign.yml dispatched at $REF, with nightly set (#961)" >> "$GITHUB_STEP_SUMMARY"
      - name: The weekly sweep, dispatched at NIGHTLY_REF and waited for
        if: github.event.schedule == env.SWEEP_CRON
        timeout-minutes: 350
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          # The step's shell is bash -eo pipefail: a failure inside $(...) would
          # end it before its output were printed, and so would a grep that
          # finds nothing.
          if ! out=$(gh workflow run campaign.yml --repo "$REPO" --ref "$REF" -f sweep=all -f jobs=8 2>&1); then
            printf '%s\n' "$out"
            echo "::error::the sweep was not dispatched (#975)"
            exit 1
          fi
          printf '%s\n' "$out"
          id=$(printf '%s\n' "$out" | grep -m 1 -oE '/actions/runs/[0-9]+' | cut -d/ -f4 || true)
          if [ -z "$id" ]; then
            echo "::error::gh did not say which run it started, so the sweep cannot be waited for (#975)"
            echo "**gh did not say which run it started**: the sweep is not waited for (#975)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "the weekly sweep: campaign.yml dispatched at $REF, with sweep all on eight jobs, as run $id (#975)" >> "$GITHUB_STEP_SUMMARY"
          if gh run watch "$id" --repo "$REPO" --exit-status --interval 300 > /dev/null; then
            echo "the sweep's run $id passed: every patch caught (#975)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the sweep's run $id failed: a patch no longer caught, or the run itself (#975)"
            echo "**the sweep's run $id failed**: a patch no longer caught, or the run itself (#975)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
